plugins {
    id 'base'
    id 'jacoco'
    id 'org.jreleaser' version '1.25.0'
}

allprojects {
    group = 'io.github.raulbolivarnavas'
    version = '1.1.0'

    repositories {
        mavenCentral()
        mavenLocal()
    }
}

subprojects {
    apply plugin: 'java-library'
    apply plugin: 'jacoco'
    apply plugin: 'maven-publish'

    java {
        toolchain {
            languageVersion = JavaLanguageVersion.of(21)
        }
        withSourcesJar()
        withJavadocJar()
    }

    tasks.withType(JavaCompile).configureEach {
        options.encoding = 'UTF-8'
    }

    tasks.withType(Javadoc).configureEach {
        options.encoding = 'UTF-8'
        options.addBooleanOption('Xdoclint:none', true)
    }

    tasks.withType(Test).configureEach {
        useJUnitPlatform()
    }

    tasks.withType(JacocoReport).configureEach {
        reports {
            html.required = true
            xml.required = true
            csv.required = false
        }
    }

    jacoco {
        toolVersion = '0.8.13'
    }

    publishing {
        publications {
            mavenJava(MavenPublication) {
                from components.java

                pom {
                    name = project.name
                    description = "Support Logging module ${project.name}"
                    url = 'https://github.com/raulbolivarnavas/java-webflux-support-logging'

                    licenses {
                        license {
                            name = 'Apache License, Version 2.0'
                            url = 'https://www.apache.org/licenses/LICENSE-2.0.txt'
                            distribution = 'repo'
                        }
                    }

                    developers {
                        developer {
                            id = 'raulbolivarnavas'
                            name = 'Raul Bolivar'
                            url = 'https://github.com/raulbolivarnavas'
                        }
                    }

                    scm {
                        connection = 'scm:git:git://github.com/raulbolivarnavas/java-webflux-support-logging.git'
                        developerConnection = 'scm:git:ssh://github.com/raulbolivarnavas/java-webflux-support-logging.git'
                        url = 'https://github.com/raulbolivarnavas/java-webflux-support-logging'
                    }
                }
            }
        }

        repositories {
            maven {
                name = 'staging'
                url = rootProject.layout.buildDirectory.dir('staging-deploy')
            }
        }
    }
}

tasks.register('jacocoReports') {
    group = 'verification'
    description = 'Generates JaCoCo HTML reports for all subprojects.'

    dependsOn subprojects.collect { project ->
        project.tasks.named('jacocoTestReport')
    }
}

jreleaser {
    project {
        authors = ['Raul Bolivar']
        license = 'Apache-2.0'

        links {
            homepage = 'https://github.com/raulbolivarnavas/java-webflux-support-logging'
        }
    }

    signing {
        active = 'ALWAYS'
        armored = true
    }

    release {
        github {
            enabled = true
            repoOwner = 'raulbolivarnavas'
            name = 'java-webflux-support-logging'
            branch = 'main'
            overwrite = false
            skipTag = false
            skipRelease = false
            immutableRelease = false
        }
    }

    deploy {
        maven {
            mavenCentral {
                sonatype {
                    active = 'ALWAYS'
                    url = 'https://central.sonatype.com/api/v1/publisher'
                    stagingRepository(
                            rootProject.layout.buildDirectory
                                    .dir('staging-deploy')
                                    .get()
                                    .asFile
                                    .absolutePath
                    )
                }
            }
        }
    }
}
